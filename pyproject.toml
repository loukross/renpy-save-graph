[project]
name = "renpy-save-graph"
version = "0.1.0"
description = "A personal tool for organizing, versioning, and branch-visualizing Ren'Py save files."
readme = "README.md"
authors = [
    { name = "loukross" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["renpy", "save-editor", "git", "flowchart", "save-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi[standard]>=0.100.0",
    "Pillow>=9.0.0",
    "platformdirs>=3.0.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]

[project.scripts]
renpy-save-graph = "renpy_save_graph.server:_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "unit: Fast isolated unit tests",
    "integration: System integration tests (Git, SQLite, Watcher)",
    "api: REST API contract tests",
    "ui: Web UI tests",
    "playwright: Playwright browser end-to-end UI tests",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]
